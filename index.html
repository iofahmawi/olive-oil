<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>حاسبة زيت الزيتون</title>

    <meta name="theme-color" content="#606c38">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-1024.png">
    <link rel="apple-touch-icon" href="icon-1024.png">

    <style>
        :root {
            --primary: #606c38; 
            --accent-gold: #bc6c25; 
            --white: #ffffff;
            --bg-light: #f8fafc;
            --text-main: #283618;
            --text-muted: #606c38;
            --radius: 16px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            --standard-height: 40px;
        }

        * { 
            box-sizing: border-box; 
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        /* تعديل: جعل خلفية الـ html تطابق الهيدر لسد أي فجوة تقنية */
        html { background-color: var(--primary); }

        body { 
            height: 100%; 
            background-color: var(--bg-light); 
            overflow: hidden; 
            direction: rtl;
            text-align: right;
            display: flex;
            flex-direction: column;
            color: var(--text-main);
        }

        .content-wrapper { flex-grow: 1; display: flex; flex-direction: column; }

        .header-olive {
            background-color: var(--primary);
            color: var(--white);
            padding: 30px 25px 60px; 
            text-align: center;
            border-bottom-left-radius: 35px;
            border-bottom-right-radius: 35px;
            position: relative;
            /* تعديل: سحب الهيدر بكسل إضافي للأعلى لضمان عدم وجود فراغ */
            margin-top: -1px;
        }

        @media (display-mode: standalone), (display-mode: fullscreen) {
            .header-olive {
                padding-top: calc(1.10cm + env(safe-area-inset-top, 0px) + 1px);
                padding-bottom: 80px; 
            }
        }

        .header-olive h2 { font-size: 1.6rem; font-weight: 700; margin-bottom: 10px; }
        .header-olive p { font-size: 1rem; opacity: 0.9; }

        .card {
            background-color: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 23px; 
            width: 92%;
            max-width: 350px;
            margin: -35px auto 5px; 
            position: relative;
            z-index: 10;
        }

        .input-group { margin-bottom: 12px; } 

        .input-group label {
            display: block;
            font-size: 0.91rem; 
            color: var(--text-muted);
            margin-bottom: 5px;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            height: var(--standard-height);
            padding: 0 10px; 
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 700;
            text-align: center; 
            background: #fdfdfd;
            color: var(--primary);
            transition: border-color 0.2s;
        }

        .input-group input:focus { border-color: var(--primary); background: var(--white); }

        .results-area {
            margin-top: 20px; 
            background: var(--white);
            border-radius: 12px;
            padding: 10px 15px; 
            border: 1.5px solid #f1f5f9;
        }

        .result-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 6px 0; 
            font-size: 0.95rem; 
        }

        .divider { border-top: 1px solid #f1f5f9; margin: 4px 0; } 

        .result-label { color: #444; font-weight: 500; }
        .result-value { color: var(--primary); font-weight: 700; }
        .highlight { color: var(--accent-gold); font-weight: 700; }

        #densityValue { cursor: pointer; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            display: none; 
            justify-content: center;
            align-items: flex-start;
            padding-top: 15vh;
            z-index: 1000;
            backdrop-filter: blur(3px);
        }

        .modal-content {
            background: var(--white);
            width: 85%;
            max-width: 300px;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            animation: slideUp 0.3s ease-out;
            position: relative;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-content h3 { margin-bottom: 15px; font-size: 1.1rem; color: var(--primary); }

        .modal-input {
            width: 100%;
            height: 45px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--primary);
        }

        .modal-btns { display: flex; gap: 10px; }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-save { background: var(--primary); color: white; }
        .btn-cancel { background: #f1f5f9; color: #64748b; }

        .simple-footer { 
            text-align: center; font-size: 0.9rem; 
            padding: 20px 0 calc(15px + env(safe-area-inset-bottom, 0px)); 
            margin-top: auto; 
        }

        .simple-footer a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .footer-text-ar { color: #888; font-weight: normal; }
    </style>
</head>
<body onclick="document.activeElement.blur()">

    <div class="content-wrapper">
        <div class="header-olive">
            <h2>🫒 حاسبة زيت الزيتون</h2>
            <p>حساب الأوزان والأسعار بدقة</p>
        </div>

        <div class="card" onclick="event.stopPropagation()">
            <div class="input-group">
                <label>سعر العبوة:</label>
                <input type="number" inputmode="decimal" id="totalPrice" oninput="calculate()" step="any" autocomplete="off" onkeydown="if(event.key==='Enter') this.blur()">
            </div>

            <div class="input-group">
                <label>السعة باللتر:</label>
                <input type="number" inputmode="decimal" id="liters" oninput="calculate()" step="any" autocomplete="off" onkeydown="if(event.key==='Enter') this.blur()">
            </div>

            <div class="results-area">
                <div class="result-row" style="cursor: pointer;" onclick="openModal()">
                    <span class="result-label">كثافة الزيت:</span>
                    <span class="result-value" id="densityValue">0.916</span>
                </div>
                <div class="divider"></div>
                
                <div class="result-row">
                    <span class="result-label">الوزن بالكيلو:</span>
                    <span class="result-value" id="totalKg">0.00</span>
                </div>
                <div class="divider"></div>
                
                <div class="result-row">
                    <span class="result-label">سعر اللتر الواحد:</span>
                    <span class="result-value" id="pricePerLiter">0.00</span>
                </div>
                <div class="result-row">
                    <span class="result-label">سعر الكيلو الواحد:</span>
                    <span class="result-value" id="pricePerKg">0.00</span>
                </div>
                <div class="divider"></div>
                
                <div class="result-row">
                    <span class="result-label">سعر تنكة 16 لتر:</span>
                    <span class="result-value highlight" id="tanakaLiterPrice">0.00</span>
                </div>
                <div class="result-row">
                    <span class="result-label">سعر تنكة 16 كيلو:</span>
                    <span class="result-value highlight" id="tanakaKgPrice">0.00</span>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="densityModal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3>تعديل كثافة الزيت</h3>
            <input type="number" inputmode="decimal" id="newDensityInput" class="modal-input" step="0.001" onkeydown="if(event.key==='Enter') saveDensity()">
            <div class="modal-btns">
                <button class="btn btn-cancel" onclick="closeModal()">إلغاء</button>
                <button class="btn btn-save" onclick="saveDensity()">حفظ</button>
            </div>
        </div>
    </div>

    <footer class="simple-footer">
        <a href="https://github.com/iofahmawi" target="_blank">
            <span class="footer-text-ar">طوّر بواسطة</span> iofahmawi
        </a>
    </footer>

    <script>
        const DEFAULT_DENSITY = 0.916;
        let currentDensity = DEFAULT_DENSITY;

        window.onload = function() {
            const savedDensity = localStorage.getItem('oliveDensity');
            if (savedDensity) {
                currentDensity = parseFloat(savedDensity);
                document.getElementById('densityValue').innerText = currentDensity;
            }
            
            document.getElementById('totalPrice').value = '';
            document.getElementById('liters').value = '';
            calculate(); 
        };

        function openModal() {
            const modalInput = document.getElementById('newDensityInput');
            modalInput.value = currentDensity;
            document.getElementById('densityModal').style.display = 'flex';
            
            setTimeout(() => {
                modalInput.focus();
                modalInput.select();
            }, 100);
        }

        function closeModal() {
            document.getElementById('densityModal').style.display = 'none';
        }

        function saveDensity() {
            const val = document.getElementById('newDensityInput').value.trim();
            
            if (val === "") {
                currentDensity = DEFAULT_DENSITY;
                localStorage.removeItem('oliveDensity');
            } else if (!isNaN(val) && parseFloat(val) > 0) {
                currentDensity = parseFloat(val);
                localStorage.setItem('oliveDensity', currentDensity);
            }

            document.getElementById('densityValue').innerText = currentDensity;
            calculate();
            closeModal();
        }

        function calculate() {
            const pVal = document.getElementById('totalPrice').value;
            const lVal = document.getElementById('liters').value;
            const price = parseFloat(pVal);
            const ltr = parseFloat(lVal);

            if (!isNaN(price) && !isNaN(ltr) && price > 0 && ltr > 0) {
                const totalWeightKg = ltr * currentDensity;
                const pLtr = price / ltr;
                const pKg = price / totalWeightKg;

                document.getElementById('totalKg').innerText = totalWeightKg.toFixed(2);
                document.getElementById('pricePerLiter').innerText = pLtr.toFixed(2);
                document.getElementById('pricePerKg').innerText = pKg.toFixed(2);
                document.getElementById('tanakaLiterPrice').innerText = (pLtr * 16).toFixed(2);
                document.getElementById('tanakaKgPrice').innerText = (pKg * 16).toFixed(2);
            } else {
                ['totalKg', 'pricePerLiter', 'pricePerKg', 'tanakaLiterPrice', 'tanakaKgPrice'].forEach(f => 
                    document.getElementById(f).innerText = "0.00"
                );
            }
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
            });
        }
    </script>
</body>
</html>
