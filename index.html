<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>حاسبة زيت الزيتون</title>

    <meta name="theme-color" content="#f8fafc">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-1440.png">
    <link rel="apple-touch-icon" href="icon-1440.png">

    <style>
        :root {
            --primary: #606c38; 
            --accent-gold: #bc6c25; 
            --white: #ffffff;
            --bg-light: #f8fafc;
            --text-main: #283618;
            --text-muted: #606c38;
            --radius: 16px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            --standard-height: 40px;
        }

        * { 
            box-sizing: border-box; 
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        html, body { height: 100%; background-color: var(--bg-light); overflow: hidden; }

        body {
            direction: rtl;
            text-align: right;
            display: flex;
            flex-direction: column;
            color: var(--text-main);
        }

        .content-wrapper { flex-grow: 1; display: flex; flex-direction: column; }

        .header-card {
            background-color: var(--primary);
            border-radius: var(--radius);
            box-shadow: 0 4px 12px -2px rgba(96,108,56,0.18);
            padding: 19px 20px 9px;
            width: 92%;
            max-width: 350px;
            margin: 20px auto 0;
            text-align: center;
        }

        @media (display-mode: standalone), (display-mode: fullscreen) {
            .header-card { padding-top: 21px; padding-bottom: 11px; }
        }

        #oliveIcon { display: inline-block; cursor: pointer; transition: transform 0.1s; }
        @keyframes oliveFlash {
            0%   { transform: scale(1); }
            25%  { transform: scale(1.4) rotate(-15deg); }
            50%  { transform: scale(0.9) rotate(10deg); }
            75%  { transform: scale(1.2) rotate(-5deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
        .olive-flash { animation: oliveFlash 0.5s ease; }

        .app-title {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--white);
            margin-bottom: 6px;
        }

        .app-subtitle {
            font-size: 0.88rem;
            color: rgba(255,255,255,0.7);
            margin-bottom: 10px;
        }

        .card {
            background-color: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 23px; 
            width: 92%;
            max-width: 350px;
            margin: 17px auto 5px; 
            position: relative;
            z-index: 10;
        }

        .input-group { margin-bottom: 12px; } 

        .input-group label {
            display: inline-block;
            font-size: 0.91rem; 
            color: var(--text-muted);
            margin-bottom: 5px;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
        }

        .input-group input {
            width: 100%;
            height: var(--standard-height);
            padding: 0 10px; 
            border: 1.5px solid #e4ecf3;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 700;
            text-align: center; 
            background: #fdfdfd;
            color: var(--primary);
            transition: border-color 0.2s;
        }

        .input-group input:focus { border-color: var(--primary); background: var(--white); }

        .results-area {
            margin-top: 20px; 
            background: var(--white);
            border-radius: 12px;
            padding: 4px 20px; 
        }

        .result-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 8px 0; 
            font-size: 0.95rem; 
        }

        .divider { border-top: 1px solid #f1f5f9; margin: 4px 0; } 

        .result-label { color: #444; font-weight: 500; }
        .result-value { color: var(--primary); font-weight: 700; }
        .highlight { color: var(--accent-gold); font-weight: 700; }

        #densityValue, #tanakaLabel { cursor: pointer; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            display: none; 
            justify-content: center;
            align-items: flex-start;
            padding-top: 15vh;
            z-index: 1000;
            backdrop-filter: blur(3px);
        }

        .modal-content {
            background: var(--white);
            width: 85%;
            max-width: 300px;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .modal-input {
            width: 100%;
            height: 45px;
            border: 2px solid #edf2f7;
            border-radius: 10px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--primary);
        }

        .modal-btns { display: flex; gap: 10px; }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-save { background: var(--primary); color: white; }
        .btn-cancel { background: #edf2f7; color: #64748b; }

        .simple-footer { 
            text-align: center; font-size: 0.9rem; 
            padding: 20px 0 calc(15px + env(safe-area-inset-bottom, 0px)); 
            margin-top: auto; 
        }

        .simple-footer a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .footer-text-ar { color: #888; font-weight: normal; }

        .no-select {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body onclick="document.activeElement.blur()">

    <div class="content-wrapper">
        <div class="header-card">
            <h2 class="app-title"><span id="oliveIcon" onclick="resetDefaults()">🫒</span> حاسبة زيت الزيتون</h2>
            <p class="app-subtitle">حساب الأوزان والأسعار بدقة</p>
        </div>

        <div class="card" onclick="event.stopPropagation()">
            <div class="input-group">
                <label class="block-label">سعر العبوة:</label>
                <input type="number" inputmode="decimal" id="totalPrice" oninput="validateMainInput(this); calculate()" onkeydown="handleEnter(event)" step="any" autocomplete="off">
            </div>

            <div class="input-group">
                <label id="quantityLabel" onclick="toggleInputUnit()">السعة باللتر:</label>
                <input type="number" inputmode="decimal" id="quantity" oninput="validateMainInput(this); calculate()" onkeydown="handleEnter(event)" step="any" autocomplete="off">
            </div>

            <div class="results-area">
                <div class="result-row no-select" style="cursor: pointer;" id="densityRow">
                    <span class="result-label">كثافة الزيت:</span>
                    <span class="result-value" id="densityValue">0.916</span>
                </div>

                <div class="result-row">
                    <span class="result-label" id="altResultLabel">الوزن بالكيلو:</span>
                    <span class="result-value" id="altResultValue">0.00</span>
                </div>

                <div class="result-row">
                    <span class="result-label">سعر اللتر الواحد:</span>
                    <span class="result-value" id="pricePerLiter">0.00</span>
                </div>
                <div class="result-row">
                    <span class="result-label">سعر الكيلو الواحد:</span>
                    <span class="result-value" id="pricePerKg">0.00</span>
                </div>

                <div class="result-row no-select" style="cursor: pointer;" id="tanakaRow">
                    <span class="result-label" id="tanakaLabel">سعر تنكة 16 كيلو:</span>
                    <span class="result-value highlight" id="tanakaValue">0.00</span>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="densityModal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 style="margin-bottom: 15px; color: var(--primary);">تعديل كثافة الزيت</h3>
            <input type="number" inputmode="decimal" id="newDensityInput" class="modal-input" onkeydown="handleEnter(event, true, 'density')" oninput="validatePositive(this)" step="0.001" min="0.001">
            <div class="modal-btns">
                <button class="btn btn-cancel" onclick="closeModal()">إلغاء</button>
                <button class="btn btn-save" onclick="saveDensity()">حفظ</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="sizeModal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 id="sizeModalTitle" style="margin-bottom: 15px; color: var(--primary);">تعديل الحجم</h3>
            <input type="number" inputmode="decimal" id="newSizeInput" class="modal-input" onkeydown="handleEnter(event, true, 'size')" oninput="validatePositive(this)" step="any" min="0.001">
            <div class="modal-btns">
                <button class="btn btn-cancel" onclick="closeModal()">إلغاء</button>
                <button class="btn btn-save" onclick="saveSize()">حفظ</button>
            </div>
        </div>
    </div>

    <footer class="simple-footer">
        <a href="https://github.com/iofahmawi" target="_blank">
            <span class="footer-text-ar">طوّر بواسطة</span> iofahmawi
        </a>
    </footer>

    <script>
        const DEFAULT_DENSITY = 0.916;
        const DEFAULT_SIZE = 16;
        
        let currentDensity = DEFAULT_DENSITY;
        let tanakaSize = DEFAULT_SIZE;
        let inputMode = 'ltr'; 
        let tanakaMode = 'kg';

        let pressTimer;
        let pressTarget = null;
        const tanakaRow = document.getElementById('tanakaRow');
        const densityRow = document.getElementById('densityRow');

        tanakaRow.addEventListener('mousedown', e => startPress(e, 'size'));
        tanakaRow.addEventListener('touchstart', e => startPress(e, 'size'));
        tanakaRow.addEventListener('mouseup', cancelPress);
        tanakaRow.addEventListener('mouseleave', cancelPress);
        tanakaRow.addEventListener('touchend', cancelPress);
        tanakaRow.addEventListener('click', function() { toggleTanakaUnit(); });

        densityRow.addEventListener('mousedown', e => startPress(e, 'density'));
        densityRow.addEventListener('touchstart', e => startPress(e, 'density'));
        densityRow.addEventListener('mouseup', cancelPress);
        densityRow.addEventListener('mouseleave', cancelPress);
        densityRow.addEventListener('touchend', cancelPress);

        function startPress(e, target) {
            pressTarget = target;
            pressTimer = window.setTimeout(function() {
                if (pressTarget === 'size') openSizeModal();
                else if (pressTarget === 'density') openModal();
            }, 600);
        }
        function cancelPress() { clearTimeout(pressTimer); pressTarget = null; }

        window.onload = function() {
            const savedDensity = localStorage.getItem('oliveDensity');
            if (savedDensity) {
                currentDensity = parseFloat(savedDensity);
                document.getElementById('densityValue').innerText = currentDensity;
            }
            const savedSize = localStorage.getItem('oliveTanakaSize');
            if (savedSize) { tanakaSize = parseFloat(savedSize); }

            const savedInputMode = localStorage.getItem('oliveInputMode');
            if (savedInputMode) { 
                inputMode = savedInputMode; 
                updateInputLabels();
            }

            const savedTanakaMode = localStorage.getItem('oliveTanakaMode');
            if (savedTanakaMode) { tanakaMode = savedTanakaMode; }
            
            updateTanakaLabel();
            calculate(); 
        };

        function handleEnter(event, isModal = false, type = '') {
            if (event.key === "Enter") {
                event.target.blur();
                if (isModal) {
                    if (type === 'density') saveDensity();
                    if (type === 'size') saveSize();
                }
            }
        }

        function toggleInputUnit() {
            inputMode = (inputMode === 'ltr') ? 'kg' : 'ltr';
            localStorage.setItem('oliveInputMode', inputMode);
            updateInputLabels();
            calculate();
        }

        function updateInputLabels() {
            document.getElementById('quantityLabel').innerText = (inputMode === 'ltr') ? "السعة باللتر:" : "الوزن بالكيلو:";
            document.getElementById('altResultLabel').innerText = (inputMode === 'ltr') ? "الوزن بالكيلو:" : "السعة باللتر:";
        }

        function toggleTanakaUnit() {
            if(document.getElementById('sizeModal').style.display === 'flex') return;
            tanakaMode = (tanakaMode === 'kg') ? 'ltr' : 'kg';
            localStorage.setItem('oliveTanakaMode', tanakaMode);
            updateTanakaLabel();
            calculate();
        }

        function updateTanakaLabel() {
            const unitText = (tanakaMode === 'kg') ? "كيلو" : "لتر";
            document.getElementById('tanakaLabel').innerText = `سعر تنكة ${tanakaSize} ${unitText}:`;
        }

        function openModal() {
            const modalInput = document.getElementById('newDensityInput');
            modalInput.value = currentDensity;
            document.getElementById('densityModal').style.display = 'flex';
            setTimeout(() => { modalInput.focus(); }, 100);
        }

        function openSizeModal() {
            clearTimeout(pressTimer);
            const modalInput = document.getElementById('newSizeInput');
            modalInput.value = tanakaSize;
            document.getElementById('sizeModalTitle').innerText = (tanakaMode === 'kg') ? "تعديل الوزن" : "تعديل السعة";
            document.getElementById('sizeModal').style.display = 'flex';
            setTimeout(() => { modalInput.focus(); }, 100);
        }

        function closeModal() { 
            document.getElementById('densityModal').style.display = 'none'; 
            document.getElementById('sizeModal').style.display = 'none';
            const di = document.getElementById('newDensityInput');
            di.style.borderColor = ''; di.style.background = '';
            const si = document.getElementById('newSizeInput');
            si.style.borderColor = ''; si.style.background = '';
        }

        function validatePositive(input) {
            const val = parseFloat(input.value);
            if (input.value !== '' && !isNaN(val) && val <= 0) {
                input.style.borderColor = '#e53e3e';
                input.style.background = '#fff5f5';
            } else {
                input.style.borderColor = '#e4ecf3';
                input.style.background = '';
            }
        }

        function saveDensity() {
            const input = document.getElementById('newDensityInput');
            const raw = input.value.trim();
            const val = parseFloat(raw);
            // إذا كان فارغاً → يرجع للقيمة الافتراضية
            if (raw === '' || isNaN(val)) {
                currentDensity = DEFAULT_DENSITY;
            } else if (val <= 0) {
                // يمنع السالب والصفر
                input.style.borderColor = '#e53e3e';
                input.style.background = '#fff5f5';
                input.focus();
                return;
            } else {
                currentDensity = val;
            }
            localStorage.setItem('oliveDensity', currentDensity);
            document.getElementById('densityValue').innerText = currentDensity;
            calculate();
            closeModal();
        }

        function saveSize() {
            const input = document.getElementById('newSizeInput');
            const raw = input.value.trim();
            const val = parseFloat(raw);
            if (raw === '' || isNaN(val)) {
                tanakaSize = DEFAULT_SIZE;
            } else if (val <= 0) {
                input.style.borderColor = '#e53e3e';
                input.style.background = '#fff5f5';
                input.focus();
                return;
            } else {
                tanakaSize = val;
            }
            localStorage.setItem('oliveTanakaSize', tanakaSize);
            updateTanakaLabel();
            calculate();
            closeModal();
        }

        function validateMainInput(input) {
            const val = input.value;
            if (val !== '' && (isNaN(parseFloat(val)) || parseFloat(val) < 0)) {
                input.style.borderColor = '#e53e3e';
                input.style.background = '#fff5f5';
            } else {
                input.style.borderColor = '#e4ecf3';
                input.style.background = '';
            }
        }

        function resetDefaults() {
            currentDensity = DEFAULT_DENSITY;
            tanakaSize = DEFAULT_SIZE;
            tanakaMode = 'kg';
            inputMode = 'ltr';

            localStorage.setItem('oliveDensity', currentDensity);
            localStorage.setItem('oliveTanakaSize', tanakaSize);
            localStorage.setItem('oliveTanakaMode', tanakaMode);
            localStorage.setItem('oliveInputMode', inputMode);

            document.getElementById('densityValue').innerText = currentDensity;
            updateInputLabels();
            updateTanakaLabel();
            calculate();

            // وميض الأيقونة
            const icon = document.getElementById('oliveIcon');
            icon.classList.remove('olive-flash');
            void icon.offsetWidth; // إعادة تشغيل الأنيميشن
            icon.classList.add('olive-flash');
            icon.addEventListener('animationend', () => icon.classList.remove('olive-flash'), { once: true });
        }

        function calculate() {
            const price = parseFloat(document.getElementById('totalPrice').value);
            const qty = parseFloat(document.getElementById('quantity').value);
            const hasQty = !isNaN(qty) && qty > 0;
            const hasPrice = !isNaN(price) && price > 0;

            // كمية فقط → يظهر التحويل بدون سعر
            if (hasQty) {
                let ltr, kg;
                if (inputMode === 'ltr') {
                    ltr = qty; kg = qty * currentDensity;
                    document.getElementById('altResultValue').innerText = kg.toFixed(2);
                } else {
                    kg = qty; ltr = qty / currentDensity;
                    document.getElementById('altResultValue').innerText = ltr.toFixed(2);
                }

                if (hasPrice) {
                    const pLtr = price / ltr;
                    const pKg = price / kg;
                    document.getElementById('pricePerLiter').innerText = pLtr.toFixed(2);
                    document.getElementById('pricePerKg').innerText = pKg.toFixed(2);
                    const result = (tanakaMode === 'kg') ? (pKg * tanakaSize) : (pLtr * tanakaSize);
                    document.getElementById('tanakaValue').innerText = result.toFixed(2);
                } else {
                    ['pricePerLiter', 'pricePerKg', 'tanakaValue'].forEach(id =>
                        document.getElementById(id).innerText = "0.00"
                    );
                }
            } else {
                ['altResultValue', 'pricePerLiter', 'pricePerKg', 'tanakaValue'].forEach(id => 
                    document.getElementById(id).innerText = "0.00"
                );
            }
        }

        // تسجيل Service Worker مع منطق التحديث الإجباري
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(reg => {
                    reg.addEventListener('updatefound', () => {
                        const newWorker = reg.installing;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                window.location.reload(); 
                            }
                        });
                    });
                }).catch(err => console.log('SW Error:', err));
            });

            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) {
                    window.location.reload();
                    refreshing = true;
                }
            });
        }
    </script>
</body>
</html>
